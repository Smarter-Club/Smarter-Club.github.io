<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d29">
  <meta name="description" content="Smarter Club — coming soon.">
  <title>Smarter Club</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root { color-scheme: dark; --bg:#102d29; --ink:#f3f5eb; --muted:#b8cbc2; --line:#426057; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:Arial, Helvetica, sans-serif; -webkit-font-smoothing:antialiased; }
    .wrap { width:min(1240px, calc(100% - 112px)); margin-inline:auto; }
    header { padding-block:34px; border-bottom:1px solid var(--line); }
    .brand { width:330px; max-width:70%; overflow:hidden; }
    .brand img { display:block; width:138%; max-width:none; height:auto; margin:-8% 0 -8% -20%; }
    main { padding:34px 0; }
    .coming { margin:0; color:var(--muted); font-size:14px; letter-spacing:0.02em; }
    @media (max-width:1000px) { .wrap { width:calc(100% - 64px); } }
    @media (max-width:560px) { .wrap { width:calc(100% - 40px); } header { padding-block:24px; } .brand { width:230px; } main { padding-block:26px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><img src="assets/smarter-club-logo.png" alt="Smarter Club" width="2172" height="724"></div>
    </header>
    <main><p class="coming">Coming soon</p></main>
  </div>
</body>
</html>
